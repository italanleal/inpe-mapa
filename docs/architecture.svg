<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 760" role="img" height="760" aria-labelledby="architecture-title architecture-description" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="760" fill="#1a1a19" rx="12" />
  <title>Arquitetura do pipeline INPE para mapa D3 na AWS</title>
  <desc>Produtor Python local baixa CSVs do INPE, envia para S3 e SQS FIFO. Lambda consumidora grava no DynamoDB; Lambda de consulta lê pelo GSI e serve o mapa D3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="30" y="76" width="620" height="206" rx="16" fill="none" stroke="#343432" stroke-width="1" stroke-dasharray="4 4" />
  <text x="630" y="98" text-anchor="end" fill="#f1efe8" font-size="14px" font-weight="500">Sua máquina · produtor Python</text>
  <rect x="30" y="312" width="620" height="322" rx="16" fill="none" stroke="#343432" stroke-width="1" stroke-dasharray="4 4" />
  <text x="50" y="334" fill="#f1efe8" font-size="14px" font-weight="500">AWS · sa-east-1</text>
  <g>
    <rect x="50" y="14" width="170" height="40" rx="8" stroke-width="0.5" fill="#444441" stroke="#72716a" />
    <text x="135" y="34" text-anchor="middle" dominant-baseline="central" fill="#d3d1c7" font-size="14px" font-weight="500">INPE · CSVs de 10 min</text>
  </g>
  <g>
    <rect x="50" y="114" width="170" height="56" rx="8" stroke-width="0.5" fill="#085041" stroke="#1d826a" />
    <text x="135" y="134" text-anchor="middle" dominant-baseline="central" fill="#9fe1cb" font-size="14px" font-weight="500">Download</text>
    <text x="135" y="153" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5" font-size="12px" font-weight="400">e normalização</text>
  </g>
  <g>
    <rect x="255" y="114" width="170" height="56" rx="8" stroke-width="0.5" fill="#085041" stroke="#1d826a" />
    <text x="340" y="134" text-anchor="middle" dominant-baseline="central" fill="#9fe1cb" font-size="14px" font-weight="500">SQLite</text>
    <text x="340" y="153" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5" font-size="12px" font-weight="400">dedup e checkpoints</text>
  </g>
  <g>
    <rect x="460" y="114" width="170" height="56" rx="8" stroke-width="0.5" fill="#085041" stroke="#1d826a" />
    <text x="545" y="134" text-anchor="middle" dominant-baseline="central" fill="#9fe1cb" font-size="14px" font-weight="500">CSV consolidado</text>
    <text x="545" y="153" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5" font-size="12px" font-weight="400">ordenado por data UTC</text>
  </g>
  <g>
    <rect x="255" y="206" width="170" height="56" rx="8" stroke-width="0.5" fill="#085041" stroke="#1d826a" />
    <text x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#9fe1cb" font-size="14px" font-weight="500">Streaming do S3</text>
    <text x="340" y="245" text-anchor="middle" dominant-baseline="central" fill="#5dcaa5" font-size="12px" font-weight="400">ignora IDs já enviados</text>
  </g>
  <g>
    <rect x="450" y="362" width="180" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="540" y="382" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">S3 privado</text>
    <text x="540" y="401" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">snapshots do dataset</text>
  </g>
  <g>
    <rect x="240" y="362" width="170" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="325" y="382" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">SQS FIFO</text>
    <text x="325" y="401" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">1 a 10 registros/msg</text>
  </g>
  <g>
    <rect x="50" y="362" width="140" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="120" y="382" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">SQS DLQ</text>
    <text x="120" y="401" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">após 5 falhas</text>
  </g>
  <g>
    <rect x="240" y="458" width="170" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="325" y="478" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">Lambda consumidora</text>
    <text x="325" y="497" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">H3 · 1 msg por vez</text>
  </g>
  <g>
    <rect x="240" y="554" width="170" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="325" y="574" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">DynamoDB</text>
    <text x="325" y="593" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">observação + contador</text>
  </g>
  <g>
    <rect x="450" y="554" width="180" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="540" y="574" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">GSI por horário</text>
    <text x="540" y="593" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">ObservationsByTime</text>
  </g>
  <g>
    <rect x="450" y="458" width="180" height="56" rx="8" stroke-width="0.5" fill="#3c3489" stroke="#635ab1" />
    <text x="540" y="478" text-anchor="middle" dominant-baseline="central" fill="#cecbf6" font-size="14px" font-weight="500">Lambda de consulta</text>
    <text x="540" y="497" text-anchor="middle" dominant-baseline="central" fill="#afa9ec" font-size="12px" font-weight="400">Function URL · leitura</text>
  </g>
  <g>
    <rect x="50" y="672" width="170" height="56" rx="8" stroke-width="0.5" fill="#444441" stroke="#72716a" />
    <text x="135" y="692" text-anchor="middle" dominant-baseline="central" fill="#d3d1c7" font-size="14px" font-weight="500">Hospedagem estática</text>
    <text x="135" y="711" text-anchor="middle" dominant-baseline="central" fill="#b4b2a9" font-size="12px" font-weight="400">Vercel · HTML, CSS, JS</text>
  </g>
  <g>
    <rect x="255" y="672" width="170" height="56" rx="8" stroke-width="0.5" fill="#444441" stroke="#72716a" />
    <text x="340" y="692" text-anchor="middle" dominant-baseline="central" fill="#d3d1c7" font-size="14px" font-weight="500">Navegador</text>
    <text x="340" y="711" text-anchor="middle" dominant-baseline="central" fill="#b4b2a9" font-size="12px" font-weight="400">mapa D3 · polling 5 s</text>
  </g>
  <line x1="135" y1="54" x2="135" y2="112" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="220" y1="142" x2="253" y2="142" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="425" y1="142" x2="458" y2="142" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="340" y1="170" x2="340" y2="204" stroke-dasharray="4 4" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="545" y1="170" x2="545" y2="360" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <text x="553" y="300" fill="#c2c0b6" font-size="12px" font-weight="400">upload --scrape</text>
  <path fill="none" d="M480 360 L480 234 L427 234" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" />
  <text x="472" y="300" text-anchor="end" fill="#c2c0b6" font-size="12px" font-weight="400">download --start</text>
  <line x1="325" y1="262" x2="325" y2="360" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <text x="333" y="330" fill="#c2c0b6" font-size="12px" font-weight="400">pausa configurável</text>
  <line x1="240" y1="390" x2="192" y2="390" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="325" y1="418" x2="325" y2="456" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="325" y1="514" x2="325" y2="552" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="410" y1="582" x2="448" y2="582" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="500" y1="514" x2="500" y2="552" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="580" y1="552" x2="580" y2="516" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <line x1="220" y1="700" x2="253" y2="700" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" fill="none" />
  <path fill="none" d="M630 486 L664 486 L664 700 L427 700" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5px" />
  <title id="architecture-title">Arquitetura do pipeline INPE, AWS e mapa D3</title>
  <desc id="architecture-description">Produtor local baixa e consolida CSVs do INPE, envia ao S3 e ao SQS. A Lambda agrupa por H3 no DynamoDB. O navegador consulta a Function URL pública e apresenta o mapa D3.</desc>
</svg>
